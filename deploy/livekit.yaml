# LiveKit для локальной разработки.
#
# Отличия от режима --dev: явные ключи и вебхуки. Ключи те же, что в
# --dev (devkey/secret), поэтому клиенты и сервер не меняются.
#
# Вебхуки идут на Go-сервер. Из контейнера адрес хоста — host.docker.internal;
# compose задаёт его в extra_hosts. Когда API запущен на Windows, это шлюз WSL
# (172.31.240.1), а не host-gateway: иначе запрос уходит в саму WSL.
port: 7880

bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  # Локальный адрес WSL: его видят и Windows, и Android-эмулятор.
  # При смене IP WSL (перезапуск) обновить здесь и перезапустить контейнер.
  node_ip: "172.31.240.241"

keys:
  devkey: secret

webhook:
  api_key: devkey
  urls:
    - "http://host.docker.internal:8080/webhooks/livekit"

logging:
  level: info
